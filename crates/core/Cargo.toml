[package]
name = "golden-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure maths for golden: sun position, sunset, (later) horizon and spot search. No IO."

[lib]
name = "golden_core"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
contracts = { path = "../contracts" }

[dev-dependencies]
# Only for examples/search_la.rs (real LA heights). Core itself stays IO-free.
vexcel = { path = "../vexcel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
