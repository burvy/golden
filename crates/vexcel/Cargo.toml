[package]
name = "vexcel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Vexcel DSM fetch, disk cache and downsample to a ground-metre DsmGrid"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs", "time", "sync", "rt-multi-thread", "macros"] }
tiff = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
contracts = { path = "../contracts" }
